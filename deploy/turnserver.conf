# coturn config for Crowdwave. Replace the secret and realm; the same secret goes in TURN_SECRET.
listening-port=3478
fingerprint
use-auth-secret
static-auth-secret=CHANGE_ME_TO_A_LONG_RANDOM_STRING
realm=crowdwave
no-cli
no-tls
no-dtls
min-port=49160
max-port=49200
# Do not let relayed peers reach private ranges you do not intend to expose:
no-multicast-peers
